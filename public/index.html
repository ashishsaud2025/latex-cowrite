<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LaTeX Cowrite</title>

<!-- CodeMirror 5 for the source editor -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/stex/stex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>LaTeX Editor <span class="tag">live collaboration</span></h1>
  <div class="header-actions">
    <select id="project-select" title="Active project"></select>
    <button id="new-project-btn" title="Create a new project">+ Project</button>
    <button id="project-settings-btn" type="button" title="Project settings">Settings</button>
    <div id="collaborators" aria-label="Project collaborators"></div>
    <label class="project-toggle" title="Let collaborators in this project share their clipboard content. Off by default: each user's clipboard is private to their own changes.">
      <input id="project-clipboard-toggle" type="checkbox" />
      <span>Shared Clipboard</span>
    </label>
    <span id="tectonic-status" class="status-pill status-unknown">checking tectonic…</span>
    <span id="collaboration-status" class="status-pill status-unknown">connecting…</span>
    <button id="save-btn" disabled>Save</button>
    <button id="compile-btn">Compile</button>
  </div>
</header>

<div id="settings-modal" class="modal hidden" aria-hidden="true">
  <div class="modal-backdrop" data-close-settings="true"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-header">
      <h2 id="settings-title">Project Settings</h2>
      <button id="settings-close-btn" type="button" aria-label="Close settings">×</button>
    </div>
    <form id="project-settings-form">
      <div class="settings-grid">
        <label>
          <span>Editor theme</span>
          <select id="settings-theme">
            <option value="eclipse">Eclipse</option>
            <option value="dracula">Dracula</option>
            <option value="monokai">Monokai</option>
            <option value="material-darker">Material Darker</option>
            <option value="solarized dark">Solarized Dark</option>
            <option value="tomorrow-night-eighties">Tomorrow Night Eighties</option>
          </select>
        </label>

        <label class="checkbox-row">
          <input id="settings-line-numbers" type="checkbox" />
          <span>Show line numbers</span>
        </label>

        <label class="checkbox-row">
          <input id="settings-line-wrapping" type="checkbox" />
          <span>Wrap long lines</span>
        </label>

        <label>
          <span>Tab size</span>
          <select id="settings-tab-size">
            <option value="2">2</option>
            <option value="4">4</option>
            <option value="8">8</option>
          </select>
        </label>

        <label>
          <span>Default preview tab</span>
          <select id="settings-default-tab">
            <option value="pdf">PDF</option>
            <option value="log">Logs</option>
          </select>
        </label>
      </div>

      <div class="modal-actions">
        <button id="settings-raw-btn" type="button" class="secondary-btn">Open raw JSON</button>
        <button id="settings-cancel-btn" type="button" class="secondary-btn">Cancel</button>
        <button id="settings-save-btn" type="submit">Save Settings</button>
      </div>
    </form>

    <div id="settings-raw-panel" class="raw-panel hidden">
      <label for="settings-raw-json">Raw project config</label>
      <textarea id="settings-raw-json" spellcheck="false"></textarea>
      <div class="modal-actions raw-actions">
        <button id="settings-raw-close-btn" type="button" class="secondary-btn">Back to form</button>
        <button id="settings-raw-apply-btn" type="button">Apply JSON</button>
      </div>
    </div>
  </div>
</div>

<main>
  <section id="editor-pane">
    <div id="tree-sidebar">
      <div id="tree-toolbar">
        <span>Files</span>
        <div class="tree-toolbar-actions">
          <button id="new-file-btn" title="New file">+ File</button>
          <button id="new-folder-btn" title="New folder">+ Folder</button>
        </div>
      </div>
      <div id="tree-container"></div>
    </div>
    <div id="tree-resizer" class="resize-handle resize-handle-vertical" role="separator" aria-label="Resize file tree" aria-orientation="vertical" tabindex="0"></div>
    <div id="editor-container">
      <div id="editor-tab-bar">
        <span id="active-file-name">No file open</span>
        <span id="dirty-indicator" class="hidden">● unsaved</span>
      </div>
      <textarea id="source"></textarea>
    </div>
  </section>

  <div id="pane-resizer" class="resize-handle resize-handle-vertical" role="separator" aria-label="Resize editor and PDF preview" aria-orientation="vertical" tabindex="0"></div>
  <section id="preview-pane">
    <div id="preview-toolbar">
      <span id="compile-state"></span>
    </div>
    <div id="preview-tabs" role="tablist" aria-label="Preview tabs">
      <button id="pdf-tab" class="preview-tab active" type="button" role="tab" aria-selected="true" aria-controls="pdf-view" data-view="pdf">PDF</button>
      <button id="log-tab" class="preview-tab" type="button" role="tab" aria-selected="false" aria-controls="log-view" data-view="log">Logs</button>
    </div>
    <div id="preview-content">
      <div id="pdf-view" class="preview-view active" role="tabpanel" aria-labelledby="pdf-tab">
        <div id="pdf-container">
          <p id="pdf-placeholder">Click "Compile" to render a preview.</p>
        </div>
      </div>
      <div id="log-view" class="preview-view" role="tabpanel" aria-labelledby="log-tab">
        <div id="log-panel">
          <div id="log-panel-header">
            <strong>Compile log</strong>
            <button id="log-close" type="button" aria-label="Close log">×</button>
          </div>
          <pre id="log-content"></pre>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="collab-bundle.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
